
<input
  pInputText
  type="text"
  placeholder="Buscar"
  (input)="dt.filterGlobal($any($event.target).value, 'contains')"
  style="margin-bottom: 1rem; width: 100%;" />

<p-table #dt [value]="products" [paginator]="true" [rows]="10" [responsiveLayout]="'scroll'" [globalFilterFields]="['nombre', 'correo', 'telefono', 'direccion']">
  <ng-template pTemplate="header">
    <tr>
      <th>Nombre o Empresa</th>
      <th>Correo Electrónico</th>
      <th>Teléfono</th>
      <th>Dirección</th>
      <th>Descripción del Problema</th>
    </tr>
  </ng-template>

  <ng-template pTemplate="body" let-product>
    <tr>
      <td>{{ product.nombre }}</td>
      <td>{{ product.correo }}</td>
      <td>
        {{ product.telefono }}
        <small *ngIf="!isTelefonoValido(product.telefono)" class="p-error d-block">
          Número inválido (Debe iniciar con 0 y tener 10 dígitos)
        </small>
      </td>
      <td>{{ product.direccion }}</td>
      <td>
        <button pButton type="button" label="Ver Detalle" (click)="showDialog(product)"></button>

        <p-dialog header="Descripción" [(visible)]="visible" [modal]="true"
                  [style]="{ width: '50rem' }"
                  [breakpoints]="{ '1199px': '75vw', '575px': '90vw' }"
                  [maximizable]="true">
          <p>{{ selectedProduct?.descripcion }}</p>
        </p-dialog>
      </td>
    </tr>
  </ng-template>
</p-table>
